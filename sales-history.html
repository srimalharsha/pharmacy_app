<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sales History | ChannelMed</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f7f8;color:#1b3440;font:14px system-ui}header{background:white;padding:14px 18px;display:flex;justify-content:space-between;border-bottom:1px solid #e3ebee}.wrap{max-width:1100px;margin:24px auto;padding:0 15px}.panel{background:white;border:1px solid #e3ebee;border-radius:14px;padding:16px}.tools{display:flex;gap:8px;flex-wrap:wrap}input,select,button,a{font:inherit;padding:10px;border:1px solid #e3ebee;border-radius:9px;background:white;color:#1b3440;text-decoration:none}input{flex:1;min-width:180px}button{font-weight:700;cursor:pointer}.danger{color:#a33d32}table{width:100%;border-collapse:collapse;min-width:680px;margin-top:14px}th,td{text-align:left;padding:10px;border-bottom:1px solid #e3ebee}.muted{color:#71838b}.tablewrap{overflow:auto}.hidden{display:none!important}@media(max-width:600px){.wrap{margin:15px auto}.panel{padding:12px}}
</style></head><body><header><b>✚ ChannelMed · Sales History</b><div><a href="./billing-sales.html">← New Bill</a> <button id="logout">Sign out</button></div></header><main class="wrap"><h1>Sales History</h1><p class="muted" id="subtitle">Completed and voided bills</p><select id="branchSelect" class="hidden"></select><section class="panel"><div class="tools"><input id="salesSearch" placeholder="Search bill number, customer or phone"><select id="salesFilter"><option value="all">All bills</option><option value="completed">Completed</option><option value="voided">Voided</option></select><button id="refreshSales">Refresh</button></div><div class="tablewrap"><table><thead><tr><th>Bill No.</th><th>Date</th><th>Customer</th><th>Total</th><th>Status</th><th>Action</th></tr></thead><tbody id="salesRows"><tr><td colspan="6">Loading…</td></tr></tbody></table></div><p id="message" class="muted"></p></section></main>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";import{getAuth,onAuthStateChanged,signOut,setPersistence,browserLocalPersistence}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";import{getFirestore,doc,getDoc,collection,getDocs,runTransaction,serverTimestamp,query,orderBy,limit}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
const cfg={apiKey:"AIzaSyDh6M-yGPJozWWKU1ZImHSPAq-52IrXVxA",authDomain:"channelmed-manager.firebaseapp.com",projectId:"channelmed-manager",storageBucket:"channelmed-manager.firebasestorage.app",messagingSenderId:"859321844496",appId:"1:859321844496:web:f35e6eacc47d30e79d5b95"},app=initializeApp(cfg),auth=getAuth(app),db=getFirestore(app);await setPersistence(auth,browserLocalPersistence);
let profile,pharmacyId,branchId,user,sales=[];const $=id=>document.getElementById(id),money=n=>"Rs. "+Number(n||0).toFixed(2),can=a=>profile?.role==="owner"||(profile?.role==="staff"&&profile?.permissions?.billing?.[a]===true),sref=()=>collection(db,"pharmacies",pharmacyId,"branches",branchId,"sales"),iref=()=>collection(db,"pharmacies",pharmacyId,"branches",branchId,"inventory");
function say(t){$("message").textContent=t}
async function load(){if(!can("view")){$("salesRows").innerHTML='<tr><td colspan="6">You do not have permission to view sales.</td></tr>';return}try{let snap=await getDocs(query(sref(),orderBy("createdAt","desc"),limit(200)));sales=snap.docs.map(d=>({id:d.id,...d.data()}));render()}catch(e){say("Could not load bills: "+(e.code||e.message))}}
function render(){let q=$("salesSearch").value.toLowerCase().trim(),f=$("salesFilter").value,body=$("salesRows");body.innerHTML="";let rows=sales.filter(s=>(f==="all"||s.status===f)&&[s.billNumber,s.customerName,s.customerPhone].join(" ").toLowerCase().includes(q));if(!rows.length){body.innerHTML='<tr><td colspan="6">No bills found.</td></tr>';return}rows.forEach(s=>{let tr=document.createElement("tr"),date=s.createdAt?.toDate?.()?s.createdAt.toDate().toLocaleString():"—";[s.billNumber||s.id.slice(0,8),date,s.customerName||"Walk-in",money(s.total),s.status||"completed"].forEach(v=>{let td=document.createElement("td");td.textContent=v;tr.append(td)});let td=document.createElement("td");if(s.status!=="voided"&&can("void")){let b=document.createElement("button");b.className="danger";b.textContent="Void";b.onclick=()=>voidBill(s);td.append(b)}else td.textContent="—";tr.append(td);body.append(tr)})}
async function voidBill(s){if(!can("void")||!confirm("Void "+s.billNumber+" and return sold quantities to stock?"))return;try{await runTransaction(db,async tx=>{let sr=doc(sref(),s.id),ss=await tx.get(sr);if(!ss.exists()||ss.data().status==="voided")throw Error("Bill already voided.");let changes=[];for(let item of ss.data().items||[]){let ir=doc(iref(),item.inventoryId),is=await tx.get(ir);if(!is.exists())throw Error("Stock batch missing: "+item.medicineName);changes.push({ir,data:is.data(),item})}changes.forEach(x=>tx.update(x.ir,{quantity:Number(x.data.quantity)+Number(x.item.quantity),updatedAt:serverTimestamp(),updatedBy:user.uid,lastVoidedSaleId:s.id}));tx.update(sr,{status:"voided",voidedAt:serverTimestamp(),voidedBy:user.uid})});say("Bill voided and stock returned.");await load()}catch(e){say("Could not void bill: "+(e.code||e.message))}}
$("salesSearch").oninput=render;$("salesFilter").onchange=render;$("refreshSales").onclick=load;$("logout").onclick=async()=>{await signOut(auth);location.href="./index.html"};$("branchSelect").onchange=()=>{branchId=$("branchSelect").value;load()};
onAuthStateChanged(auth,async u=>{if(!u){location.href="./index.html";return}user=u;try{let p=await getDoc(doc(db,"userProfiles",u.uid));if(!p.exists())throw Error("User profile missing.");profile=p.data();if(profile.active!==true||!["owner","staff"].includes(profile.role)||!profile.pharmacyId)throw Error("Account inactive.");pharmacyId=profile.pharmacyId;let ph=await getDoc(doc(db,"pharmacies",pharmacyId));if(!ph.exists()||ph.data().status!=="active")throw Error("Pharmacy inactive.");if(profile.role==="staff"){branchId=profile.branchId;if(!can("view")&&!can("void"))throw Error("Sales History access not granted.");$("subtitle").textContent=(ph.data().name||"Pharmacy")+" · Staff branch"}else{let bs=await getDocs(collection(db,"pharmacies",pharmacyId,"branches"));if(!bs.size)throw Error("No branches found.");bs.docs.forEach(d=>{let o=document.createElement("option");o.value=d.id;o.textContent=d.data().name||d.id;$("branchSelect").append(o)});branchId=bs.docs[0].id;$("branchSelect").classList.remove("hidden")}await load()}catch(e){say("Cannot open Sales History: "+(e.code||e.message))}});
</script></body></html>
