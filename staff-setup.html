<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Staff Account Setup | ChannelMed</title><style>body{margin:0;background:#f3f7f8;font:15px system-ui;color:#1b3440;display:grid;place-items:center;min-height:100vh}.card{background:white;padding:28px;border-radius:16px;width:min(420px,calc(100% - 36px));box-shadow:0 8px 30px #173d4b12}input,button{box-sizing:border-box;width:100%;padding:12px;margin:8px 0;border:1px solid #dce6e9;border-radius:9px;font:inherit}button{background:#0f766e;color:white;border:0;font-weight:750}#message{color:#93462e;font-size:13px}</style></head><body><main class="card"><h2>✚ ChannelMed Manager</h2><h3>Complete Staff Account Setup</h3><p>Enter the same email address that received this invitation, then create your password.</p><form id="setupForm"><input id="email" type="email" required placeholder="Invited email address"><input id="password" type="password" required minlength="6" placeholder="Create password (6+ characters)"><button id="submit" type="submit">Create Staff Account</button></form><div id="message" role="status"></div></main><script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import{getAuth,isSignInWithEmailLink,signInWithEmailLink,updatePassword}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import{getFirestore,doc,getDoc,setDoc,updateDoc,serverTimestamp}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
const cfg={apiKey:"AIzaSyDh6M-yGPJozWWKU1ZImHSPAq-52IrXVxA",authDomain:"channelmed-manager.firebaseapp.com",projectId:"channelmed-manager",storageBucket:"channelmed-manager.firebasestorage.app",messagingSenderId:"859321844496",appId:"1:859321844496:web:f35e6eacc47d30e79d5b95"};
const app=initializeApp(cfg),auth=getAuth(app),db=getFirestore(app),inviteId=new URLSearchParams(location.search).get("invite"),msg=document.getElementById("message");
if(!inviteId)msg.textContent="Invitation link is incomplete. Ask your Pharmacy Owner to send a new invitation.";
document.getElementById("setupForm").addEventListener("submit",async e=>{e.preventDefault();const btn=document.getElementById("submit");btn.disabled=true;msg.textContent="Checking invitation…";
try{
 const email=document.getElementById("email").value.trim().toLowerCase(),password=document.getElementById("password").value;
 if(!isSignInWithEmailLink(auth,location.href))throw new Error("Please open the original invitation link from your email on this device.");
 const cred=await signInWithEmailLink(auth,email,location.href),invRef=doc(db,"staffInvitations",inviteId),invSnap=await getDoc(invRef);
 if(!invSnap.exists())throw new Error("Invitation not found. Contact your Pharmacy Owner.");
 const inv=invSnap.data();if(inv.status!=="pending"||inv.email!==String(cred.user.email||"").toLowerCase())throw new Error("This invitation is no longer valid or the email does not match.");
 await updatePassword(cred.user,password);
 await setDoc(doc(db,"userProfiles",cred.user.uid),{displayName:inv.name,email:cred.user.email,phone:inv.phone||"",role:inv.role,pharmacyId:inv.pharmacyId,branchId:inv.branchId,active:true,invitationId:inviteId,createdAt:serverTimestamp()});
 await updateDoc(invRef,{status:"accepted",acceptedUid:cred.user.uid,acceptedAt:serverTimestamp()});
 location.href="./staff-dashboard.html";
}catch(err){console.error(err);msg.textContent=err.code==="auth/weak-password"?"Please choose a stronger password.":(err.message||"Could not complete setup.");btn.disabled=false;}
});
</script></body></html>
