<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Staff Workspace | ChannelMed</title><style>body{margin:0;background:#f3f7f8;font:14px system-ui;color:#1b3440}header{background:white;padding:18px 22px;display:flex;justify-content:space-between;border-bottom:1px solid #e3ebee}.wrap{max-width:850px;margin:30px auto;padding:0 16px}.card{background:white;padding:22px;border:1px solid #e3ebee;border-radius:14px;margin-bottom:15px}.muted{color:#71838b}button{padding:9px 14px;border:1px solid #e3ebee;border-radius:8px;background:white}</style></head><body><header><b>✚ ChannelMed · Staff Workspace</b><button id="logout">Sign out</button></header><main class="wrap"><section class="card"><h2 id="welcome">Loading staff account…</h2><p id="pharmacy" class="muted"></p><p id="branch" class="muted"></p><p id="role"></p><div id="message" class="muted"></div></section><section class="card"><b>Your permitted work modules</b><p class="muted">Only the permissions assigned by your Pharmacy Owner are shown below. Medicine Stock and Billing & Sales are available when your owner grants access.</p><div id="workModules"></div></section></main><script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";import{getAuth,onAuthStateChanged,signOut,setPersistence,browserLocalPersistence}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";import{getFirestore,doc,getDoc}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
const cfg={apiKey:"AIzaSyDh6M-yGPJozWWKU1ZImHSPAq-52IrXVxA",authDomain:"channelmed-manager.firebaseapp.com",projectId:"channelmed-manager",storageBucket:"channelmed-manager.firebasestorage.app",messagingSenderId:"859321844496",appId:"1:859321844496:web:f35e6eacc47d30e79d5b95"},app=initializeApp(cfg),auth=getAuth(app),db=getFirestore(app);await setPersistence(auth,browserLocalPersistence);
document.getElementById("logout").onclick=async()=>{await signOut(auth);location.href="./index.html";};
onAuthStateChanged(auth,async user=>{if(!user){location.href="./index.html";return;}try{const p=await getDoc(doc(db,"userProfiles",user.uid));if(!p.exists()||p.data().active!==true||p.data().role!=="staff"){await signOut(auth);location.href="./index.html";return;}const d=p.data(),ph=await getDoc(doc(db,"pharmacies",d.pharmacyId)),br=await getDoc(doc(db,"pharmacies",d.pharmacyId,"branches",d.branchId));if(!ph.exists()||ph.data().status!=="active"||!br.exists()){document.getElementById("message").textContent="Your account or assigned branch is not active. Contact your Pharmacy Owner.";return;}document.getElementById("welcome").textContent="Welcome, "+(d.displayName||user.email);document.getElementById("pharmacy").textContent="Pharmacy: "+(ph.data().name||ph.data().pharmacyName||"");document.getElementById("branch").textContent="Assigned branch: "+(br.data().name||"");document.getElementById("role").textContent="Role: Staff";const moduleBox=document.getElementById("workModules");const permissions=d.permissions||{};const labels={inventory:"Medicine Stock",billing:"Billing & Sales",suppliers:"Suppliers",customers:"Customers",reports:"Reports",expiryAlerts:"Expiry & Alerts",stockTransfers:"Stock Transfers"};moduleBox.innerHTML="";let allowed=0;Object.entries(labels).forEach(([key,label])=>{const access=permissions[key]||{};if(access.view===true){allowed++;const item=document.createElement("div");item.className="module-item";item.style.padding="10px 0";item.style.borderBottom="1px solid #e3ebee";const actions=Object.entries(access).filter(([action,on])=>on===true).map(([action])=>action).join(", ");{const urls={inventory:"./medicine-stock.html",billing:"./billing-sales.html",suppliers:"./pharmacy-operations.html#suppliers",customers:"./pharmacy-operations.html#customers",reports:"./pharmacy-operations.html#reports",expiryAlerts:"./pharmacy-operations.html#expiry",stockTransfers:"./pharmacy-operations.html#transfers"};const link=document.createElement("a");link.href=urls[key];link.textContent=label+" · Open "+label+" →";link.style.color="#0f766e";link.style.fontWeight="750";link.style.textDecoration="none";item.append(link);const detail=document.createElement("div");detail.className="muted";detail.style.fontSize="12px";detail.textContent="Permissions: "+actions;item.append(detail)}moduleBox.append(item);}});if(!allowed)moduleBox.textContent="No work permissions have been assigned yet. Please contact your Pharmacy Owner.";}catch(e){document.getElementById("message").textContent="Could not load staff workspace ("+(e.code||e.message)+").";}});
</script></body></html>
